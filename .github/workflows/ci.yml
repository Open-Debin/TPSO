name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      # Keep Transformers 5.5.4 for validated CLIP compatibility.
      # CVE-2026-9856 concerns saving malicious tokenizer/processor chat templates.
      # TPSO does not expose that save/export workflow.
      # Reassess this exception if tokenizer/processor export is added.
      - name: Audit runtime dependencies
        run: pip-audit --requirement requirements.txt --progress-spinner off --ignore-vuln CVE-2026-9856
      - name: CLI smoke tests
        run: |
          tpso-generate --model sd15 --prompt "a red panda" --dry-run
          tpso-generate --model sd21 --prompt "a red panda" --dry-run
          tpso-generate --model sd35 --prompt "a red panda" --dry-run
      - name: Build package
        run: python -m build
      - name: Validate package metadata
        run: twine check dist/*
